[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "multi-llm-companion"
version = "1.1.0"
description = "複数のLLMを切り替えて利用できるWindows向けデスクトップ会話アプリ"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "PySide6>=6.8,<7.0",
    "PyYAML>=6.0.2,<7.0",
    "httpx[http2]>=0.27.2,<1.0",
    "pydantic>=2.9,<3.0",
    "python-dotenv>=1.0.1,<2.0",
    "sounddevice>=0.5,<1.0",
    "vosk>=0.3.45,<1.0",
    "faster-whisper>=1.2,<2.0",
    "numpy>=2.0,<3.0",
    "panda3d>=1.10.16,<1.11",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"multi_llm_companion.ui" = ["native/UMTNativePlugin.dll"]
