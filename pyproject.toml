[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "multi-llm-companion"
version = "0.23.0"
description = "複数のLLMを切り替えて利用できるWindows向けデスクトップ会話アプリ"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "PySide6>=6.8,<7.0",
    "PyYAML>=6.0.2,<7.0",
    "httpx[http2]>=0.27.2,<1.0",
    "pydantic>=2.9,<3.0",
    "python-dotenv>=1.0.1,<2.0",
    "sounddevice>=0.5,<1.0",
    "vosk>=0.3.45,<1.0",
    "faster-whisper>=1.2,<2.0",
    "numpy>=2.0,<3.0",
    "panda3d>=1.10.16,<1.11",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<10.0",
    "ruff>=0.8,<1.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"multi_llm_companion.ui" = ["native/UMTNativePlugin.dll"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers --basetemp=.test-tmp"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
# Git管理外のチェックアウトでも、生成物・外部環境は走査しない。
extend-exclude = [
    "tools/motion-converter/runtime",
    "local",
    ".codex-tmp",
    ".codex-test-tmp-*",
    ".test-*",
    ".pytest-*",
    ".venv_old",
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "SIM"]

[tool.ruff.format]
docstring-code-format = true
quote-style = "double"
