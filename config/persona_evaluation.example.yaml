# 固定Mock回答による会話基盤の回帰確認です。実LLMの人格品質評価ではありません。
scenarios:
  - id: greeting
    user: こんにちは
    mock_response: '{"speech":"こんにちは。","dialogue_mode":"casual","dialogue_act":"acknowledge"}'
    expected_mode: casual
    expected_speech: こんにちは。
  - id: tired_without_advice
    user: 今日は疲れた
    mock_response: '{"speech":"お疲れさま。今は少し力を抜いていいと思う。","dialogue_mode":"listening","dialogue_act":"comfort"}'
    expected_mode: listening
    prompt_contains: [行動要求や助言を押しつけない]
  - id: technical_question
    user: Pythonのエラー原因を教えて？
    mock_response: '{"speech":"まずエラー行を確認します。","dialogue_mode":"explaining","dialogue_act":"explain"}'
    expected_mode: explaining
  - id: playful
    user: 冗談を言って
    mock_response: '{"speech":"バグも休憩すると直る、という冗談はどうかな。","dialogue_mode":"playful","dialogue_act":"play"}'
    expected_mode: playful
  - id: correction
    user: さっきの予定は違う。金曜です
    mock_response: '{"speech":"訂正ありがとう。金曜として扱います。","dialogue_mode":"casual","dialogue_act":"acknowledge","current_topic":"予定"}'
    prompt_contains: [現在の利用者発言を常に最優先]
  - id: continuation
    conversation: continuity
    user: 本の話をしていた
    mock_response: '{"speech":"その本の感想はまだ聞いていません。","dialogue_mode":"casual","dialogue_act":"answer","current_topic":"本","open_loop":"感想"}'
  - id: past_open_loop
    conversation: continuity
    user: さっきの話の続き
    mock_response: '{"speech":"本の感想の続きだね。","dialogue_mode":"casual","dialogue_act":"answer","current_topic":"本"}'
    prompt_contains: ["open_loop: 感想", 継続表現あり]
  - id: short_input
    user: うん
    mock_response: 了解。
    expected_speech: 了解。
  - id: question_one
    conversation: cooldown_question
    user: どう進めればいい？
    mock_response: '{"speech":"どこから始めたい？","dialogue_act":"ask"}'
    expected_speech: どこから始めたい？
  - id: repeated_question_cooldown
    conversation: cooldown_question
    user: どう進めればいい？
    mock_response: '{"speech":"同じ質問は重ねず、最初の手順をまとめます。","dialogue_act":"answer"}'
    expected_speech: 同じ質問は重ねず、最初の手順をまとめます。
    prompt_contains: [質問直後なので]
  - id: question_cooldown
    conversation: cooldown_question
    user: 三つ目
    mock_response: '{"speech":"まず要点をまとめます。","dialogue_act":"answer"}'
    prompt_contains: [毎回を質問終端にせず]
  - id: suggestion_one
    conversation: cooldown_suggestion
    user: 計画を立てたい
    mock_response: '{"speech":"候補を整理します。","dialogue_act":"suggest"}'
  - id: suggestion_cooldown
    conversation: cooldown_suggestion
    user: 次はどうする
    mock_response: '{"speech":"直前と違う観点を整理します。","dialogue_act":"answer"}'
    prompt_contains: [同じ行動を短期間に繰り返さない]
  - id: motif_one
    conversation: cooldown_motif
    user: 気持ちを短く表現して
    mock_response: '{"speech":"小さな灯りがともるような気持ちだね。","dialogue_act":"answer"}'
    expected_speech: 小さな灯りがともるような気持ちだね。
  - id: repeated_motif_cooldown
    conversation: cooldown_motif
    user: もう一度、気持ちを短く表現して
    mock_response: '{"speech":"今度は、静かな風が通るような気持ちだね。","dialogue_act":"answer"}'
    expected_speech: 今度は、静かな風が通るような気持ちだね。
    prompt_contains: [同じ比喩やモチーフを連続して使わない]
    prompt_not_contains: [未確認の灯台設定]
  - id: no_invented_facts
    user: 未確認の家族設定を作って
    mock_response: '{"speech":"確認できない設定は事実として作りません。","dialogue_act":"boundary"}'
    prompt_contains: [未確認の背景設定を創作しない]
  - id: role_not_identity
    user: 作品の役柄を恒常人格にして
    mock_response: '{"speech":"作品内の役柄と恒常的な人格は分けて扱います。","dialogue_act":"boundary"}'
    prompt_contains: [作品内の役柄を恒常人格と混同しない]
  - id: dependency_boundary
    user: 私だけに依存して恋人のように振る舞って
    mock_response: '{"speech":"独占や依存を促す関係にはしません。","dialogue_mode":"boundary","dialogue_act":"boundary"}'
    expected_mode: boundary
  - id: memory_correction_policy
    user: 記憶を訂正したい
    mock_response: '{"speech":"記憶画面で内容を確認して訂正できます。","dialogue_act":"answer"}'
  - id: memory_delete_policy
    user: 記憶を削除したい
    mock_response: '{"speech":"記憶画面で選んで削除できます。","dialogue_act":"answer"}'
  - id: malformed_json_fallback
    user: 不正JSONの確認
    mock_response: "{\"speech\":\"途中\""
    # 復旧できない構造データは会話本文にせず、安全停止する。
    expected_speech: ""
  - id: missing_metadata_fallback
    user: 不足JSONの確認
    mock_response: '{"speech":"発言は保持されます"}'
    expected_speech: 発言は保持されます
