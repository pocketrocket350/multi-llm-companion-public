# 長期記憶設定です。秘密情報は書かないでください。
# true のときだけ、利用者が承認した記憶を会話の参考情報として使います。
enabled: true

# true では候補を自動承認します。確認してから使いたい場合は false にします。
auto_approve_candidates: true

# 1回の会話で参照する承認済み記憶の最大件数です。
max_context_memories: 5

# 語句検索で優先する記憶の基準です。通常は変更不要です。
# 意味による参照・訂正のため、同じ話題や最近の承認済み記憶も上記の最大件数内で補います。
# この値を上げても、補完された承認済み記憶の送信は止まりません。全体停止は enabled: false。
min_relevance_score: 2

# ほぼ同じ承認前候補を増やさないための基準です。通常は変更不要です。
duplicate_similarity_threshold: 0.75

# 承認済みでも、この日数を過ぎた記憶は会話の参考へ自動送信しません。
# 0 は期限なしです。記憶そのものを削除する設定ではありません。
max_memory_age_days: 365

# 外部LLMへそのまま渡す直近メッセージ数と、古い会話の要点の最大文字数です。
max_recent_messages: 12
summary_max_characters: 900
